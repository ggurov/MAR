[project]
name = "mar"
version = "0.1.0"
description = "My AI Router — local subscription/key tracker and omp setup assistant (not a proxy)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Gennady Gurov" }]
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
mar = "mar.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
